<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch lernen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 3'><rect width='3' height='1' fill='%23111'/><rect y='1' width='3' height='1' fill='%23dd0000'/><rect y='2' width='3' height='1' fill='%23ffce00'/></svg>">
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1c1c1e; --muted:#6b6b70; --line:#e4e2dc; --soft:#efeee9;
  --accent:#d97706; --ok:#16a34a; --bad:#dc2626;
  --der:#2563eb; --der-bg:#e8f0ff; --die:#dc2647; --die-bg:#ffeaee; --das:#15924a; --das-bg:#e6f7ec;
  --pl:#8b3fd9; --pl-bg:#f3eafe; --none:#6b6b70; --none-bg:#efeee9;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141416; --panel:#1d1d20; --ink:#ececee; --muted:#9a9aa2; --line:#2e2e33; --soft:#26262a;
  --der:#6ea2ff; --der-bg:#1a2540; --die:#ff6b85; --die-bg:#3a1b23; --das:#4ad685; --das-bg:#15301f;
  --pl:#c08cff; --pl-bg:#2b1f3d; --none:#a0a0a8; --none-bg:#2a2a2e; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 60px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.02em;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:8px}
.flag{width:18px;height:13px;border-radius:2px;background:linear-gradient(#111 33%,#d00 33% 66%,#ffce00 66%)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:0;background:transparent;padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600}
nav button.on{background:var(--ink);color:var(--bg)}
nav button:hover:not(.on){background:var(--soft);color:var(--ink)}
.stats{margin-left:auto;display:flex;gap:14px;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.sub{max-width:1100px;margin:0 auto;padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel);padding:4px 11px;border-radius:999px;font-size:13px;color:var(--muted)}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.chip small{opacity:.7}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.legend{margin-left:auto;display:flex;gap:6px;font-size:12px}

.art{display:inline-block;font-weight:700;border-radius:6px;padding:0 6px;font-size:.85em;line-height:1.6}
.art.der{color:var(--der);background:var(--der-bg)} .art.die{color:var(--die);background:var(--die-bg)}
.art.das{color:var(--das);background:var(--das-bg)} .art.pl{color:var(--pl);background:var(--pl-bg)}
.art.none{color:var(--none);background:var(--none-bg)}
.c-der{color:var(--der)} .c-die{color:var(--die)} .c-das{color:var(--das)} .c-pl{color:var(--pl)}

h2{font-size:22px;letter-spacing:-.02em;margin:22px 0 4px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 4px}
.search{flex:1;min-width:200px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);outline:none}
.search:focus{border-color:var(--ink)}

/* речник */
.lesson-h{display:flex;align-items:baseline;gap:10px;margin:28px 0 0;padding-bottom:6px;border-bottom:2px solid var(--ink)}
.lesson-h b{font-size:18px} .lesson-h span{color:var(--muted);font-size:13px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:34px minmax(0,1.2fr) minmax(0,1fr) 18px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:var(--soft)}
.row .de{font-weight:600}
.row .de .pl{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.row .bg{color:var(--ink)}
.row .note{grid-column:2/4;font-size:12.5px;color:var(--muted);margin-top:-4px}
.row.verb{cursor:pointer}
.row .conj{grid-column:2/4}
.tag{font-size:11px;padding:1px 6px;border-radius:5px;background:var(--soft);color:var(--muted);margin-left:6px;font-weight:500;vertical-align:1px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);justify-self:end}
.dot.b1{background:#f59e0b}.dot.b2{background:#eab308}.dot.b3,.dot.b4,.dot.b5{background:var(--ok)}
.say{border:0;background:transparent;width:30px;height:30px;border-radius:8px;color:var(--muted);display:grid;place-items:center;padding:0}
.say:hover{background:var(--soft);color:var(--ink)}
.say svg{width:17px;height:17px}

/* таблици спрежения */
table.cj{border-collapse:collapse;font-size:14px;margin:4px 0 6px}
table.cj td{padding:2px 14px 2px 0}
table.cj td:first-child{color:var(--muted);width:80px}
table.cj .irr{color:var(--accent);font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.vcard .vh{display:flex;align-items:center;gap:6px}
.vcard .vh b{font-size:17px}
.vcard .vbg{color:var(--muted);font-size:13px;margin-bottom:6px}
.vcard .note{font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:4px}
.badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border:1px solid currentColor;border-radius:5px;padding:0 5px;margin-left:auto}

/* карти */
.stage{max-width:620px;margin:20px auto 0}
.card{position:relative;min-height:290px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 24px;cursor:pointer;user-select:none;border-top:6px solid var(--line)}
.card.g-der{border-top-color:var(--der)} .card.g-die{border-top-color:var(--die)} .card.g-das{border-top-color:var(--das)} .card.g-pl{border-top-color:var(--pl)}
.card .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.card .big .a{font-weight:700}
.card .mid{font-size:24px;font-weight:600;margin-top:4px}
.card .meta{color:var(--muted);margin-top:10px;font-size:14px}
.card .back{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);width:100%}
.card .say{position:absolute;top:12px;right:12px}
.card .corner{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted)}
.prog{height:6px;background:var(--soft);border-radius:9px;overflow:hidden;margin-bottom:12px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.pinfo{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);padding:12px;border-radius:12px;font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn kbd{font:11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.bad{color:var(--bad)} .btn.ok{color:var(--ok)}
.btn.der{color:var(--der);background:var(--der-bg);border-color:transparent;font-size:20px}
.btn.die{color:var(--die);background:var(--die-bg);border-color:transparent;font-size:20px}
.btn.das{color:var(--das);background:var(--das-bg);border-color:transparent;font-size:20px}
.keys{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
.done{text-align:center;padding:30px}
.done .score{font-size:56px;font-weight:800;letter-spacing:-.03em}

/* тест */
.opts{display:grid;gap:8px;margin-top:14px}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);padding:12px 14px;border-radius:12px;display:flex;gap:10px;align-items:center}
.opt:hover{border-color:var(--ink)}
.opt kbd{font:11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--panel))}
.answer{width:100%;font-size:22px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--panel);outline:none;text-align:center;margin-top:14px}
.answer:focus{border-color:var(--ink)}
.answer.right{border-color:var(--ok)} .answer.wrong{border-color:var(--bad)}
.uml{display:flex;gap:6px;justify-content:center;margin-top:8px}
.uml button{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:38px;height:34px;font-weight:600}
.fb{margin-top:12px;min-height:24px;text-align:center;font-weight:600}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb .sol{display:block;color:var(--ink);font-weight:700;font-size:18px;margin-top:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:16px}
.mode{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.mode:hover{border-color:var(--ink)}
.mode b{display:block;font-size:17px;margin-bottom:4px}
.mode span{color:var(--muted);font-size:13px}
.mode .ic{font-size:24px;margin-bottom:8px;display:block}

/* граматика */
.gwrap{display:grid;grid-template-columns:220px 1fr;gap:20px;margin-top:18px;align-items:start}
.gnav{display:flex;flex-direction:column;gap:2px;position:sticky;top:120px}
.gnav button{border:0;background:transparent;text-align:left;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600}
.gnav button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.gbody{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 24px 20px;box-shadow:var(--shadow)}
.gbody h2{margin-top:16px}
.gbody h4{margin:20px 0 6px;font-size:15px}
.gbody ul{padding-left:20px} .gbody li{margin:5px 0}
table.g{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px}
table.g th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:2px solid var(--line)}
table.g td{padding:7px 10px;border-bottom:1px solid var(--line)}
table.g tr:hover td{background:var(--soft)}
.tip{background:var(--soft);border-radius:10px;padding:10px 14px}

/* звук */
.say.playing{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.say.playing .w1{animation:wave .8s infinite} .say.playing .w2{animation:wave .8s .2s infinite}
@keyframes wave{50%{opacity:.15}}
.row{cursor:pointer}
.row.open{background:var(--soft)}
table.cj tr{cursor:pointer}
table.cj tr:hover td{color:var(--accent)}
table.cj tr.playing td{color:var(--accent);font-weight:700}
.spk{cursor:pointer;transition:color .15s}
.gbody i.spk{text-decoration:underline dotted color-mix(in srgb,var(--muted) 60%,transparent);text-underline-offset:3px}
.spk:hover{color:var(--accent)}
.pl-say{cursor:pointer;border-bottom:1px dashed var(--line)}
.pl-say.playing{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* анимации на картите */
.card.enter{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}}
.reveal{animation:rev .25s ease-out}
@keyframes rev{from{opacity:0;transform:translateY(-6px)}}
.opt,.btn,.mode,.qk,.cta{transition:transform .08s,border-color .15s,background .15s}
.opt:active,.btn:active,.mode:active,.qk:active,.cta:active{transform:scale(.98)}

/* Днес */
.hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-top:22px;padding:24px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.hello{font-size:30px;font-weight:800;letter-spacing:-.03em;cursor:pointer;display:inline-block}
.hello.playing{color:var(--accent)}
.cta{border:0;background:var(--ink);color:var(--bg);padding:14px 22px;border-radius:14px;font-size:17px;font-weight:700;display:inline-flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cta span{font-size:13px;font-weight:500;opacity:.7}
.cta:hover{opacity:.92}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .rb{stroke:var(--soft)} .ring .rf{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}
.ring b{font-size:26px} .ring small{color:var(--muted);font-size:12px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.qk{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.qk:hover{border-color:var(--ink)}
.qk span{font-size:22px} .qk small{color:var(--muted)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.lp{padding:10px 0;border-top:1px solid var(--line)} .lp:first-of-type{border-top:0;padding-top:0}
.lp-h{display:flex;gap:8px;align-items:baseline} .lp-h span{color:var(--muted);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .lp-h em{font-style:normal;font-weight:700}
.bar{height:10px;border-radius:9px;background:var(--soft);overflow:hidden;display:flex;margin:6px 0 4px}
.bar i{display:block;height:100%;transition:width .5s}
.bar .k,.legend2 .k{background:var(--ok)} .bar .w,.legend2 .w{background:#eab308}
.lp-f{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap} .lp-f small{color:var(--muted)}
.link{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.legend2{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--soft);margin-right:5px;vertical-align:-1px}
.wotd{border-radius:14px;padding:16px;text-align:center;cursor:pointer;border-top:5px solid var(--line);background:var(--soft)}
.wotd.g-der{border-top-color:var(--der)} .wotd.g-die{border-top-color:var(--die)} .wotd.g-das{border-top-color:var(--das)}
.wotd .big{font-size:28px;font-weight:800} .wotd small{color:var(--muted)}
.wotd.playing{outline:2px solid var(--accent)}
.week{display:flex;gap:6px;align-items:flex-end}
.wd{flex:1;text-align:center} .wd small{color:var(--muted);font-size:11px}
.wd.now small{color:var(--ink);font-weight:700}
.wb{height:70px;background:var(--soft);border-radius:6px;display:flex;align-items:flex-end;overflow:hidden}
.wb i{display:block;width:100%;background:#eab308;border-radius:6px 6px 0 0} .wb i.full{background:var(--ok)}

/* транскрипция */
.tr{display:block;font-size:12.5px;color:var(--muted);font-weight:400;font-style:italic;letter-spacing:.01em}
.row .de .tr{margin-top:1px}
.card .tr{font-size:16px;margin-top:4px}
table.cj td.tr{display:table-cell;font-size:12px;padding-left:4px}
.vbg .tr{display:inline}
.bigplay{border:0;background:var(--soft);border-radius:50%;width:96px;height:96px;display:grid;place-items:center;align-content:center;gap:2px;color:var(--ink)}
.bigplay svg{width:38px;height:38px}
.bigplay span{font-size:11px;color:var(--muted)}
.bigplay.playing{background:color-mix(in srgb,var(--accent) 20%,var(--soft));color:var(--accent)}

/* Основи */
.bhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.bact{display:flex;gap:8px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:8px}
.lt{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,transform .15s;display:flex;flex-direction:column;gap:6px}
.lt:hover{border-color:var(--ink)}
.lt.on{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.lt-top{display:flex;align-items:baseline;gap:10px}
.lt .L{font-size:40px;font-weight:800;line-height:1;letter-spacing:-.02em}
.lt .L small{font-size:26px;font-weight:600;color:var(--muted);margin-left:4px}
.lt .nm{font-size:17px;font-weight:700;color:var(--accent)}
.lt .nm i{display:block;font-size:12px;color:var(--muted);font-weight:400;font-style:normal}
.lt .snd{font-size:13px;color:var(--muted)} .lt .snd b{color:var(--ink)}
.ex{border:0;background:var(--soft);border-radius:10px;padding:7px 9px;display:flex;gap:8px;align-items:center;text-align:left;font-size:13.5px;line-height:1.3}
.ex svg{width:16px;height:16px;flex:none;color:var(--muted)}
.ex em{color:var(--muted);font-size:12px}
.ex small{color:var(--muted)}
.ex.playing{outline:2px solid var(--accent)}
.spl{font-size:12px;color:var(--muted)}
.lnote{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:5px}
.snds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.sc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.sc-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sc-h b{font-size:19px} .sc-h span{color:var(--accent);font-weight:700} .sc-h i{color:var(--muted);font-size:12px;font-style:normal}
.sc-ex{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:4px 11px;font-size:13.5px;text-align:left}
.pill em{color:var(--muted);font-size:12px}
.pill:hover{border-color:var(--ink)}
.pill.playing{border-color:var(--accent);color:var(--accent)}
.snds > .pill{border-radius:10px}
.rule{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.rule p{margin:4px 0 0;color:var(--muted)} .rule p i,.rule p b{color:var(--ink)}
.rn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px}
.read{text-align:center}
.rw{padding:18px 0 4px;min-height:110px} .rw .big{font-size:34px;font-weight:800}
.spellrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px;min-height:60px}
.sl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:center;min-width:52px;transition:.15s}
.sl b{display:block;font-size:22px} .sl small{color:var(--accent);font-weight:700}
.sl.on{border-color:var(--accent);transform:translateY(-3px)}
.numc{text-align:center;margin-top:8px}
.numw{border:0;background:none;display:inline-flex;gap:10px;align-items:center;font-size:26px;font-weight:800;margin-top:14px;word-break:break-all;color:var(--ink)}
.numw svg{width:26px;height:26px;flex:none;color:var(--muted)}
.numw.playing{color:var(--accent)}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.nb{border-radius:10px} .nb b{display:inline-block;min-width:34px}

/* пътна карта */
.road{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.step{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.step:hover{border-color:var(--ink)}
.step .si{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin-bottom:4px}
.step small{color:var(--muted);font-size:12px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.step.done .si{background:var(--ok);color:#fff;font-weight:800}
.step.next{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.step em{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.step .sp{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.step .sp i{display:block;height:100%;background:var(--ok)}

/* изречения */
.sent{display:flex;gap:8px;align-items:flex-start;text-align:left;background:var(--soft);border-radius:12px;padding:8px 12px 8px 6px;margin:8px 0;width:100%}
.sent .say{flex:none;margin-top:1px}
.sx{flex:1;min-width:0}
.sde{font-size:16.5px;line-height:1.9;font-weight:500}
.w{position:relative;cursor:pointer;border-bottom:1px dotted color-mix(in srgb,var(--muted) 70%,transparent);padding:0 1px;border-radius:3px}
.w:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);border-bottom-color:var(--accent)}
.w.hl{font-weight:800;color:var(--accent)}
.w::after{content:attr(data-t) "\A" attr(data-g);white-space:pre;position:absolute;left:50%;bottom:calc(100% + 6px);transform:translate(-50%,4px);
  background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:500;line-height:1.4;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;
  transition:.12s;z-index:20;width:max-content;max-width:240px;text-align:center;font-style:normal}
.w:hover::after{opacity:1;transform:translate(-50%,0)}
.sbg{color:var(--muted);font-size:14px;filter:blur(5px);transition:filter .2s;cursor:pointer;user-select:none}
.sent:hover .sbg,.sbg.open{filter:none}
.row .chev{grid-column:4;grid-row:1;justify-self:end;color:var(--muted);font-size:11px;transition:transform .2s;display:none}
.row:hover .chev{display:block}
.row.open .chev{transform:rotate(180deg);display:block}
.row .dot{grid-column:4;grid-row:1}
.row:hover .dot,.row.open .dot{display:none}
.row .conj{padding:2px 0 6px}
.cex{margin-top:10px;width:100%}
.card .sent .sde{font-size:17px}
.fb .sent{font-weight:400;color:var(--ink)}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:transparent}
.oline{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.oline.right{border-color:var(--ok);border-style:solid} .oline.wrong{border-color:var(--bad);border-style:solid}
.opool{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:12px;min-height:44px}
.chipw{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 12px;font-size:16px;font-weight:600;box-shadow:var(--shadow)}
.chipw:hover{border-color:var(--ink)}

/* картичка на думата */
#sheet{position:fixed;inset:0;z-index:40}
.sh-bg{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;transition:opacity .2s}
.sh{position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;padding:22px 22px 30px;
  transform:translateX(30px);opacity:0;transition:transform .2s,opacity .2s;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
#sheet.on .sh-bg{opacity:1} #sheet.on .sh{transform:none;opacity:1}
.sh-x{position:absolute;top:14px;right:14px;border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;font-size:15px}
.sh-head{background:var(--panel);border:1px solid var(--line);border-top:6px solid var(--line);border-radius:18px;padding:16px 18px;text-align:center}
.sh-head.g-der{border-top-color:var(--der)} .sh-head.g-die{border-top-color:var(--die)} .sh-head.g-das{border-top-color:var(--das)} .sh-head.g-pl{border-top-color:var(--pl)}
.sh-meta{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sh-word{display:flex;align-items:center;justify-content:center;gap:6px;font-size:32px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.sh-word .art{font-size:.6em;vertical-align:middle}
.sh-bgw{font-size:19px;font-weight:600;margin-top:6px}
.sh-pl{margin-top:6px;color:var(--muted)}
.sh-note{margin-top:10px;font-size:13.5px;background:var(--soft);border-radius:10px;padding:8px 10px;text-align:left}
.sh h4{margin:22px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.expl{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.expl li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.55}
.pats{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
.pat{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px 4px 7px;display:inline-flex;gap:6px;align-items:center;font-size:14px;font-weight:600}
.pat svg{width:15px;height:15px;color:var(--muted)}
.pat.inl{padding:1px 9px;font-size:inherit}
.pat:hover{border-color:var(--ink)} .pat.playing{border-color:var(--accent);color:var(--accent)}
.sh-cj table.cj{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sh-cj table.cj td{padding:6px 12px;border-bottom:1px solid var(--line)}
.sh-cj table.cj tr:last-child td{border-bottom:0}
.sh-foot{display:flex;gap:8px;align-items:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.sh-foot .muted{flex:1;font-size:13px}
.openw{display:inline-block;margin-top:8px;font-size:14px}
.w.known::after{content:attr(data-t) "\A" attr(data-g) "\A(двоен клик → всичко за думата)"}
.vcard{cursor:pointer;transition:border-color .15s} .vcard:hover{border-color:var(--ink)}
.wotd{cursor:pointer}

.howto{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:16px;padding:14px 18px}
.howto-h{display:flex;justify-content:space-between;align-items:center}
.howto ol{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14.5px}

/* упражнения */
.excard{min-height:150px;text-align:center}
.extask{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.exw{font-size:30px;font-weight:800;letter-spacing:-.01em}
.exs{font-size:21px;font-weight:600;line-height:1.6}
.exfb{display:none;margin-top:14px;border-radius:16px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--line)}
.exfb.on{display:block}
.exfb.ok{border-left-color:var(--ok)} .exfb.bad{border-left-color:var(--bad)}
.exhead{font-weight:800;font-size:17px;margin-bottom:6px}
.exfb.ok .exhead{color:var(--ok)} .exfb.bad .exhead{color:var(--bad)}
.exwhy{font-size:14.5px;line-height:1.6;margin-top:6px}
.exconj{display:flex;justify-content:center;margin-top:6px}
.exlinks{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.exmist{text-align:left;width:100%;margin-top:8px}
.exm{border-top:1px solid var(--line);padding:10px 0;font-size:14px}
.exbest{font-style:normal;font-size:12px;color:var(--ok);font-weight:700;margin-top:6px;display:block}
.exhero{border-color:var(--accent)}
.exsearch{grid-column:span 1}
.dlg{text-align:left;background:var(--soft);border-radius:12px;padding:8px 12px;margin-top:6px}
.dlg summary{cursor:pointer;font-size:13px;color:var(--muted)}
.dl{display:flex;gap:6px;align-items:baseline;font-size:15px}
.dl > b{flex:none;min-width:90px;font-size:13px;color:var(--muted)}
.dl .sent{margin:2px 0;padding:2px 6px 2px 0;background:none}
.opt span{flex:1}

@media (max-width:720px){
  .abc{grid-template-columns:1fr 1fr}
  .road{grid-template-columns:1fr 1fr}
  .hero{flex-direction:column-reverse;align-items:flex-start}
  .quick{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1fr}
  .stats{display:none}
  .legend{margin-left:0}
  .row{grid-template-columns:30px 1fr 12px;row-gap:0}
  .row .say{grid-column:1;grid-row:1}
  .row .de{grid-column:2;grid-row:1}
  .row .dot,.row .chev{grid-column:3;grid-row:1}
  .row .bg{grid-column:2;grid-row:2;color:var(--muted)}
  .row .note,.row .conj{grid-column:2;margin-top:2px}
  .gwrap{grid-template-columns:1fr}
  .gnav{position:static;flex-direction:row;flex-wrap:wrap}
  .card .big{font-size:30px}
}

/* ═════════ НОВ ДИЗАЙН (v3) ═════════ */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#15171c; --muted:#6a6f7b; --line:#e3e6ec; --soft:#eef0f4;
  --accent:#4f46e5; --accent-2:#eef0ff; --hl:#d97706; --r:16px;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115; --panel:#181b21; --ink:#eceef2; --muted:#9aa0ab; --line:#2a2e37; --soft:#20242c; --accent:#8b85ff; --accent-2:#23233d; --hl:#f0a43a; --shadow:none;
}}
html,body{font:16px/1.55 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;padding:8px 16px 90px}
h2{font-size:26px;letter-spacing:-.025em;margin:20px 0 6px}
h3{font-size:12px;letter-spacing:.09em;margin:26px 0 10px}
/* горна лента */
header#top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);transition:transform .25s ease}
header#top.hide{transform:translateY(-100%)}
.hrow{max-width:980px;padding:8px 16px;flex-wrap:nowrap;gap:10px;min-height:56px}
.brand{border:0;background:none;padding:4px 6px 4px 0;font-size:18px}
.topnav{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.topnav button{border:0;background:transparent;padding:8px 12px;border-radius:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:14.5px}
.topnav button.on{background:var(--accent-2);color:var(--accent)}
.topnav button:hover:not(.on){background:var(--soft);color:var(--ink)}
.hright{display:flex;align-items:center;gap:10px;margin-left:auto}
.hbtn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:7px 12px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap;box-shadow:var(--shadow)}
.hbtn .caret{color:var(--muted);font-size:11px}
.streak{font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
#sub{display:none}
.hbtn[hidden]{display:none}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.cta2{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.latest{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.lt-l{display:flex;flex-direction:column;gap:4px;flex:1;min-width:260px} .lt-l b{font-size:17px} .lt-l .bar{max-width:360px}
.lt-b{display:flex;gap:8px;flex-wrap:wrap}
.roadd{margin-top:18px} .roadd summary{cursor:pointer;font-weight:700;padding:8px 0} .roadd .road{margin-top:8px}
/* долно меню (телефон) */
#tabbar{display:none}
@media (max-width:760px){
  .topnav{display:none}
  .hrow{min-height:52px}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px}
  #tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:12px;color:var(--muted);font-size:11px;font-weight:600}
  #tabbar .ni{font-size:21px;line-height:1}
  #tabbar button.on{color:var(--accent);background:var(--accent-2)}
  .wrap{padding-bottom:110px}
  h2{font-size:23px}
}
/* панел */
#panel{position:fixed;inset:0;z-index:60}
.pn-bg{position:absolute;inset:0;background:rgba(10,12,16,.4);opacity:0;transition:opacity .18s}
.pn{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);border-left:1px solid var(--line);padding:18px;overflow-y:auto;transform:translateX(24px);opacity:0;transition:.18s}
#panel.on .pn-bg{opacity:1} #panel.on .pn{transform:none;opacity:1}
@media (max-width:760px){.pn{top:auto;left:0;right:0;width:100%;max-height:86vh;border-left:0;border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(30px);padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
.pn-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px} .pn-h b{font-size:19px}
.pn-h .sh-x{position:static}
.pn-sec{margin:20px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:11px 14px;text-align:left;width:100%}
.mrow > span:nth-child(2){flex:1;display:flex;flex-direction:column} .mrow small{color:var(--muted);font-size:13px;line-height:1.35}
.mrow .ni{font-size:20px;width:28px;text-align:center;font-weight:700;color:var(--muted)}
.mrow.on{border-color:var(--accent);background:var(--accent-2)}
.lck{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;color:#fff;flex:none}
.lrow.on .lck{background:var(--accent);border-color:var(--accent)}
.lq{display:flex;gap:8px;margin-bottom:10px} .lq .btn{flex:1;padding:9px}
.tgl{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.15s}
.tgl::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tgl.on{background:var(--accent)} .tgl.on::after{left:21px}
.pn-legend{margin-top:14px;gap:6px;flex-wrap:wrap;align-items:center}
/* общи елементи */
.card,.list,.mode,.vcard,.gbody,.panel,.hero,.sc,.lt,.qk,.step,.exfb{border-radius:var(--r)}
.btn{border-radius:12px;min-height:44px}
.btn.primary,.cta{background:var(--accent);border-color:var(--accent);color:#fff}
.mode{padding:16px;min-height:96px}
.mode:hover,.qk:hover,.step:hover{border-color:var(--accent)}
.opt{min-height:52px;font-size:16.5px;border-radius:14px}
.prog i{background:var(--accent)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-2)}
.link{color:var(--accent)}
.w.hl,.irr,table.cj .irr{color:var(--hl)}
.search:focus,.answer:focus{border-color:var(--accent)}
@media (max-width:760px){
  .modes{grid-template-columns:1fr 1fr;gap:10px}
  .mode{min-height:0;padding:13px} .mode b{font-size:15px} .mode span{font-size:12.5px} .mode .ic{font-size:21px;margin-bottom:4px}
  .exs{font-size:19px} .exw{font-size:26px}
  .card .big{font-size:30px}
  .stage{margin-top:8px}
  .hero{padding:18px}
  .gwrap{gap:12px}
  .gnav{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;position:sticky;top:52px;background:var(--bg);z-index:5;padding:6px 0}
  .gnav button{white-space:nowrap}
}
/* изречения: посочване и „Защо?“ */
.w::after{display:none}
@media (hover:hover){ .w::after{display:block} .w::after{content:attr(data-t) "\A" attr(data-g) "\A👆 цъкни: Защо?"} }
.w{border-bottom:1.5px dotted color-mix(in srgb,var(--accent) 45%,transparent)}
.w.sel{background:var(--accent-2);color:var(--accent);border-bottom-color:var(--accent)}
.sent{flex-wrap:wrap}
.xbox{flex-basis:100%;margin:8px 0 2px 34px;background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.6;animation:rev .2s ease-out;text-align:left}
.xh{display:flex;gap:8px;align-items:flex-start}
.xh > div{flex:1} .xw{font-size:19px} .xg{color:var(--muted);font-size:14px}
.xclose{border:0;background:var(--soft);border-radius:50%;width:30px;height:30px;flex:none}
.xq{font-weight:800;color:var(--accent);text-transform:uppercase;font-size:12px;letter-spacing:.08em;margin:8px 0 2px}
.xb hr{border:0;border-top:1px dashed var(--line);margin:10px 0}
.xtip{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px}
.xrule{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13.5px}
table.xt{border-collapse:collapse;margin-top:8px;font-size:13.5px;width:100%;max-width:420px}
table.xt th{font-weight:600;font-size:11.5px;color:var(--muted);text-align:left;padding:3px 6px}
table.xt td{padding:4px 6px;border-top:1px solid var(--line)}
table.xt tr.on td{background:var(--accent-2);font-weight:700}
.xf{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.xhint{font-size:13px;color:var(--accent);margin:2px 0 6px}
@media (max-width:760px){.xbox{margin-left:0}}
/* банка с думи */
.banktxt{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-top:12px;font-size:17px;line-height:2.1}
.banktxt p{margin:4px 0}
.bk{min-width:64px;border:0;border-bottom:2.5px solid var(--line);background:var(--soft);border-radius:8px 8px 0 0;padding:0 8px;font-weight:700;color:var(--muted);line-height:1.6}
.bk.cur{border-bottom-color:var(--accent);background:var(--accent-2);color:var(--accent)}
.bk.filled{color:var(--ink)}
.bk.right{border-bottom-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.bk.wrong{border-bottom-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.banksent{margin-bottom:8px}
.ocard{background:var(--soft);border-radius:12px;padding:10px 14px;text-align:left;font-size:15px;line-height:1.6;margin-top:6px}
.exfilter{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0 2px;padding-bottom:4px}
.exfilter .chip{white-space:nowrap;padding:7px 13px;font-size:14px}

/* ═════ v4: телефон + общи поправки ═════ */
@media (hover:none){ kbd, .keys{display:none !important} }
.nextbtn{width:100%;margin-top:12px;font-size:17px}
@media (max-width:760px){
  .exheros{grid-template-columns:1fr !important}
  .exheros .mode{min-height:0}
  #exnext,.nextbtn{position:sticky;bottom:calc(74px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  #bp{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 6px;margin:0 -4px;z-index:6;border-top:1px solid var(--line)}
  .banktxt{font-size:16px;padding:10px 12px}
  .btns{gap:8px} .btn{padding:12px 6px}
  .card{min-height:230px;padding:24px 16px}
  .ring{width:90px;height:90px} .ring b{font-size:20px}
  .hero{flex-direction:row;align-items:center} .hero > div:first-child{flex:1}
  .hello{font-size:24px}
  .cta{width:100%;justify-content:center}
  .lt-b .btn{flex:1}
  .opts{gap:8px} .opt{padding:12px}
  .xbox{font-size:14px;padding:10px 12px}
  table.xt{font-size:12.5px}
  .sh{padding:16px}
}

/* разбор на изречение */
.sbtns{display:flex;flex-direction:column;gap:2px;flex:none}
.anat{border:0;background:transparent;width:30px;height:30px;border-radius:8px;font-size:15px;opacity:.75}
.anat:hover,.anat.on{background:var(--accent-2);opacity:1}
.anabox{flex-basis:100%;margin:8px 0 2px 34px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:rev .2s ease-out;text-align:left}
.analine{font-size:18px;line-height:2.2;font-weight:600}
.ana{padding:2px 7px;border-radius:7px;border-bottom:3px solid transparent}
.r-subj{background:color-mix(in srgb,#3b82f6 18%,transparent);border-color:#3b82f6 !important}
.r-v{background:color-mix(in srgb,#ef4444 18%,transparent);border-color:#ef4444 !important}
.r-obj{background:color-mix(in srgb,#16a34a 18%,transparent);border-color:#16a34a !important}
.r-dat{background:color-mix(in srgb,#a855f7 18%,transparent);border-color:#a855f7 !important}
.r-pp{background:color-mix(in srgb,#0ea5e9 16%,transparent);border-color:#0ea5e9 !important}
.r-end{background:color-mix(in srgb,#f97316 20%,transparent);border-color:#f97316 !important}
.r-neg{background:color-mix(in srgb,#64748b 20%,transparent);border-color:#64748b !important}
.r-conj,.r-q{background:color-mix(in srgb,#eab308 18%,transparent);border-color:#eab308 !important}
.r-other{background:var(--soft)}
.analeg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.analeg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border-bottom:3px solid}
.analeg b{color:var(--ink)}
.anasum{margin-top:8px;font-size:14.5px;line-height:1.6}
.anacols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:10px}
.anacols > div{background:var(--soft);border-radius:10px;padding:6px 8px;font-size:14px}
.anacols small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.anacols .ana{display:inline-block;margin:2px 0}
@media (max-width:760px){.anabox{margin-left:0}.anacols{grid-auto-flow:row}}

/* цъкни дума / свържи двойки */
.tapline{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:12px;font-size:21px;line-height:2.3;text-align:center}
.tapw{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:2px 10px;font-size:20px;font-weight:600;margin:2px}
.tapw:hover{border-color:var(--accent)}
.tapw.right{background:color-mix(in srgb,var(--ok) 20%,transparent);border-color:var(--ok)} .tapw.wrong{background:color-mix(in srgb,var(--bad) 20%,transparent);border-color:var(--bad)}
.matchg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.matchg > div{display:flex;flex-direction:column;gap:8px}
.mt{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 10px;font-size:16px;font-weight:600;min-height:52px;transition:.15s}
.mt.sel{border-color:var(--accent);background:var(--accent-2)}
.mt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent);opacity:.65}
.mt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.xwrong{font-size:14px;margin:2px 0}
.bigplay.small{width:56px;height:56px;margin:0 auto 6px}
.bigplay.small svg{width:24px;height:24px}

.two > *,.gwrap > *{min-width:0}
.gbody{overflow-x:auto}
@media (max-width:760px){
  .excard{min-height:0;padding:18px 14px}
  .gbody{padding:4px 14px 16px}
  table.g{font-size:13px} table.g td,table.g th{padding:5px 6px}
  .gnav{margin:0 -16px;padding:6px 16px}
  .lp-h{flex-wrap:wrap} .lp-h span{white-space:normal}
}

/* цветен превод */
.rc-subj{box-shadow:inset 0 -3px 0 #3b82f6} .rc-v{box-shadow:inset 0 -3px 0 #ef4444} .rc-obj{box-shadow:inset 0 -3px 0 #16a34a} .rc-dat{box-shadow:inset 0 -3px 0 #a855f7}
.rc-pp{box-shadow:inset 0 -3px 0 #0ea5e9} .rc-end{box-shadow:inset 0 -3px 0 #f97316} .rc-neg{box-shadow:inset 0 -3px 0 #64748b} .rc-conj,.rc-q{box-shadow:inset 0 -3px 0 #eab308}
.bdsent .w{border-bottom:0;padding:0 2px;border-radius:4px}
.bgc{border-radius:4px;padding:0 1px}
.bdbg{font-size:15px;line-height:1.8;margin-top:4px;color:var(--ink)}
.bdd{margin-top:8px} .bdd summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.bdrows{display:grid;gap:5px;margin-top:6px}
.bdr{display:grid;grid-template-columns:minmax(90px,auto) 1fr;gap:2px 10px;align-items:center;font-size:14.5px}
.bdr .ana{justify-self:start}
.bdg{font-weight:600} .bdg small{color:var(--muted);font-weight:400}
.bdl{grid-column:2;color:var(--muted);font-size:12px;margin-top:-3px}
.bdhint{font-size:12px;margin-top:6px}

/* картинки, точки, конфети */
.emo{font-size:20px;margin-right:6px;vertical-align:-2px}
.sh-emo{font-size:64px;line-height:1.1}
.cemo{font-size:64px;line-height:1.1;margin-bottom:6px}
.picq{font-size:96px;line-height:1.1;margin:6px 0}
.opt.emopt{justify-content:center;font-size:44px;min-height:84px}
.opts.emog{grid-template-columns:1fr 1fr}
.xpchip{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-2);border-radius:99px;padding:3px 9px;margin-left:4px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.introc{text-align:center}
.introc .iemo{font-size:84px;line-height:1.1}
.introc .iw{font-size:34px;font-weight:800;letter-spacing:-.02em;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.introc .ibg{font-size:21px;font-weight:600;margin-top:4px}
.introc .imeta{color:var(--muted);margin-top:6px;font-size:14.5px}
.introc .inote{background:var(--soft);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px;text-align:left}
.lbadge{display:inline-block;background:var(--accent-2);color:var(--accent);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;margin-bottom:8px}
.xpgain{font-size:22px;font-weight:800;color:var(--accent);margin:6px 0}
.learned{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.exlearn{background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;border-color:transparent}
.exlearn span{color:rgba(255,255,255,.85)}

/* поправки на прелели елементи */
.search{min-width:0;max-width:100%}
.mode{min-width:0;overflow:hidden}
.exsearch .search{width:100%;display:block}
.exsearch #exwl{display:flex;flex-wrap:wrap;gap:4px}
.mode b,.mode span{overflow-wrap:anywhere}
.chipw{max-width:100%;white-space:normal;text-align:left}
.dlgap{background:var(--accent-2);border-radius:8px;padding:2px 6px;margin:0 -6px}
.opt span{overflow-wrap:anywhere}
img,svg,table{max-width:100%}

.card .sent .say,.card .introc .say,.introc .iw .say,.excard .say{position:static}
.card .sent{width:100%}

.xpchip .lv{font-style:normal}
.hright{min-width:0}
@media (max-width:520px){
  .hbtn span:not(.caret){display:none}
  .xpchip .lv{display:none}
  .hright{gap:6px}
  #stats{white-space:nowrap}
}

/* начало: главният бутон е цветен, другите — спокойни */
.cta.cta2{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.cta.cta2:hover{border-color:var(--accent)}
@media (max-width:760px){
  .hero{position:relative;display:block}
  .hero .ring{position:absolute;top:16px;right:16px;width:64px;height:64px}
  .hero .ring b{font-size:16px} .hero .ring small{font-size:10px}
  .hero .hello,.hero .hint{padding-right:74px}
  .hero .ctas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hero .ctas .cta{width:auto;padding:12px 10px}
  .hero .ctas #go-lesson{grid-column:1/-1}
}

.opt.emopt{justify-content:center;text-align:center;display:flex;align-items:center}

/* горното меню — винаги на един ред */
.topnav{flex-wrap:nowrap;min-width:0}
/* ако не се побира: c1 — 📚 без надпис и XP без нивото; c2 — без иконки; c3 — „Граматика“ отива в „Още“ */
.hrow.c1 .hbtn span:not(.caret),.hrow.c1 .xpchip .lv{display:none}
.hrow.c2 .topnav .ni{display:none}.hrow.c2 .topnav button{padding:8px 10px}
.hrow.c3 .topnav [data-tab="grammar"]:not(.on){display:none}
.hrow{flex-wrap:nowrap}

/* пиктограми (ARASAAC) — същия размер като емоджи на мястото си */
img.pic{display:inline-block;width:1em;height:1em;object-fit:contain;vertical-align:-0.12em;background:#fff;border-radius:.18em;padding:.04em}
.picq img.pic,.iemo img.pic,.sh-emo img.pic,.cemo img.pic{width:120px;height:120px;border-radius:14px;padding:6px}
.opt.emopt img.pic{width:96px;height:96px;border-radius:12px;padding:4px}
.opt.emopt span{font-size:60px;line-height:1}
.opt.emopt kbd{align-self:flex-start}
.emo img.pic{width:30px;height:30px;vertical-align:middle;margin-right:4px}
@media (max-width:520px){.opt.emopt img.pic{width:84px;height:84px}.opt.emopt span{font-size:54px}}

.credit{margin:18px 2px 4px;font-size:12px;color:var(--muted);line-height:1.5}.credit a{color:inherit}
</style>
</head>
<body>
<header id="top">
  <div class="hrow">
    <button class="brand"><span class="flag"></span>Deutsch</button>
    <nav id="nav" class="topnav"></nav>
    <div class="hright"><button id="lessonBtn" class="hbtn" hidden></button><span id="stats" class="streak"></span></div>
  </div>
</header>
<main class="wrap" id="view"></main>
<nav id="tabbar"></nav>
<script>window.STATIC_BUILD = true;</script>
<script src="translit.js"></script>
<script src="emoji.js"></script>
<script src="pics.js"></script>
<script src="schemes.js"></script>
<script src="data.js"></script>
<script src="basics.js"></script>
<script src="examples.js"></script>
<script src="examples2.js"></script>
<script src="grammar.js"></script>
<script src="explain.js"></script>
<script src="exercises.js"></script>
<script src="dialogs.js"></script>
<script src="app.js"></script>
</body>
</html>
